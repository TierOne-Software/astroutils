name: CI

# Runs the same job scripts as ci/run-ci.sh, so anything that fails here
# can be reproduced locally with:  ci/run-ci.sh <job>
#
# The container images come from ci/Containerfile.*; GitHub Actions runs
# the jobs directly in those images rather than through run-ci.sh, which
# only exists to give a laptop the same environment.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly deeper pass: the scheduled run fuzzes rather than just
    # replaying the corpus.
    - cron: '0 4 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glibc:
    name: glibc (${{ matrix.cc }})
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc gcc-c++ clang compiler-rt llvm meson ninja-build \
            pkgconf-pkg-config flex byacc bison libxo-devel \
            ncurses-devel libedit-devel openssl-devel zlib-devel \
            bzip2-devel xz-devel libzstd-devel libacl-devel \
            libselinux-devel binutils file diffutils git which

      - uses: actions/checkout@v4

      - name: build and test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
          BUILD_DIR: build-ci-${{ matrix.cc }}
        run: sh ci/jobs/build-test.sh

      - name: hardening check
        env:
          BUILD_DIR: build-ci-${{ matrix.cc }}
        run: sh ci/jobs/hardening-check.sh

  musl:
    name: musl (Alpine)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/alpine:latest
    steps:
      - name: dependencies
        run: |
          apk add --no-cache build-base clang llvm compiler-rt meson ninja \
            pkgconf flex bison ncurses-dev libedit-dev openssl-dev \
            zlib-dev bzip2-dev xz-dev zstd-dev acl-dev bsd-compat-headers \
            linux-headers git curl autoconf automake libtool file

      - name: libxo
        run: |
          VER=1.7.5
          curl -fsSL -o libxo.tar.gz \
            "https://github.com/Juniper/libxo/releases/download/${VER}/libxo-${VER}.tar.gz"
          tar -xf libxo.tar.gz
          cd "libxo-${VER}"
          ./configure --prefix=/usr --disable-static
          make -j"$(nproc)"
          make install

      - uses: actions/checkout@v4

      - name: build and test
        env:
          BUILD_DIR: build-ci-musl
        run: sh ci/jobs/build-test.sh

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            clang compiler-rt llvm libasan libubsan meson ninja-build \
            pkgconf-pkg-config flex byacc bison libxo-devel \
            ncurses-devel libedit-devel openssl-devel zlib-devel \
            bzip2-devel xz-devel libzstd-devel libacl-devel \
            libselinux-devel binutils file diffutils git which

      - uses: actions/checkout@v4

      - name: build and test under sanitizers
        env:
          CC: clang
          CXX: clang++
          BUILD_DIR: build-ci-asan
        run: sh ci/jobs/sanitizers.sh

  fuzz:
    name: fuzz corpus replay
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            clang compiler-rt llvm libasan libubsan meson ninja-build \
            pkgconf-pkg-config flex byacc bison libxo-devel \
            ncurses-devel libedit-devel openssl-devel zlib-devel \
            bzip2-devel xz-devel libzstd-devel libacl-devel \
            libselinux-devel binutils file diffutils git which

      - uses: actions/checkout@v4

      - name: replay corpora
        env:
          CC: clang
          # Scheduled runs fuzz for real; push/PR runs only replay.
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '300' || '0' }}
        run: sh ci/jobs/fuzz-regress.sh

      - name: upload new crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  msan:
    name: msan corpus replay
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      # MSan re-execs itself with ASLR disabled; the default container
      # seccomp profile blocks personality(ADDR_NO_RANDOMIZE), which
      # aborts every instrumented binary ("unable to disable ASLR").
      options: --security-opt seccomp=unconfined
    steps:
      - name: dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            clang compiler-rt llvm meson ninja-build \
            pkgconf-pkg-config flex byacc bison libxo-devel \
            ncurses-devel libedit-devel openssl-devel zlib-devel \
            bzip2-devel xz-devel libzstd-devel libacl-devel \
            libselinux-devel binutils file diffutils git which

      - uses: actions/checkout@v4

      - name: replay corpora under MemorySanitizer
        run: sh ci/jobs/msan.sh

  zig:
    name: zig (ReleaseSafe)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config flex byacc bison libxo-devel \
            ncurses-devel libedit-devel openssl-devel zlib-devel \
            bzip2-devel xz-devel libzstd-devel libacl-devel \
            libselinux-devel hostname words \
            diffutils git curl ca-certificates which

      # gcc is not what compiles anything here (zig's bundled clang does);
      # it is needed because `zig build -lc` detects the native libc by
      # shelling out to `cc -E -Wp,-v`, and with no cc every compile fails
      # with missing system headers/libraries.
      # Same pin as ci/Containerfile.fedora: dev snapshots vanish from
      # ziglang.org; the machengine mirror keeps them.
      - name: zig
        run: |
          VER=0.17.0-dev.1737+de207594e
          SHA=a68df95449e152d78ad3940643fb16b925d273411164295cfa12a4621e85b1da
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://pkg.machengine.org/zig/zig-x86_64-linux-${VER}.tar.xz"
          echo "${SHA}  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C /usr/local
          ln -s "/usr/local/zig-x86_64-linux-${VER}/zig" /usr/local/bin/zig

      - uses: actions/checkout@v4

      - name: build and test (ReleaseSafe)
        run: sh ci/jobs/zig-build.sh
